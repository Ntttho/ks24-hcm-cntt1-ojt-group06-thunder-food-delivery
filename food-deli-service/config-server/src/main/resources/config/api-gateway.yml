# Centralized Configuration for API Gateway
server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false # We use explicit routes with Load Balancing
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # 1. Auth & User Service Route
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/addresses/**

        # 2. Restaurant & Catalog Service Route
        - id: restaurant-service-route
          uri: lb://restaurant-service
          predicates:
            - Path=/api/v1/restaurants/**,/api/v1/shops/**,/api/v1/categories/**,/api/v1/products/**,/api/v1/toppings/**,/api/v1/vouchers/**

        # 3. Order & Cart Service Route
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/orders,/api/v1/cart/**,/api/v1/cart

        # 3b. Order WebSocket Route (STOMP Real-time)
        - id: order-service-ws-route
          uri: lb:ws://order-service
          predicates:
            - Path=/ws,/ws/**

        # 4. Payment Microservice Route
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

        # 5. Delivery & Shipper Hub Service Route
        - id: delivery-service-route
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/deliveries/**,/api/v1/shippers/**

        # 6. Review & Rating Service Route
        - id: review-service-route
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/**

        # 7. Realtime Chat & Notification WebSocket Hub Service
        - id: chat-notification-service-route
          uri: lb://chat-notification-service
          predicates:
            - Path=/api/v1/chat/**,/api/v1/notifications/**

        # 7b. Chat & Realtime WebSocket Route (STOMP Hub)
        - id: chat-notification-service-ws-route
          uri: lb:ws://chat-notification-service
          predicates:
            - Path=/ws,/ws/**,/ws-food-deli,/ws-food-deli/**
