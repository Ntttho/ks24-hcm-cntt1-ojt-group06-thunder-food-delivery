# Centralized Configuration for API Gateway
server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false # We use explicit routes with Load Balancing
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # 1. Auth & User Service Route
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/addresses/**

        # 2. Restaurant & Catalog Service Route
        - id: restaurant-service-route
          uri: lb://restaurant-service
          predicates:
            - Path=/api/v1/shops/**, /api/v1/categories/**, /api/v1/products/**, /api/v1/toppings/**, /api/v1/vouchers/**

        # 3. Order & Cart Service Route
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**, /api/v1/cart/**

        # 4. Delivery & Shipper Hub Service Route
        - id: delivery-service-route
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/deliveries/**, /api/v1/shippers/**

        # 5. Review & Rating Service Route
        - id: review-service-route
          uri: lb://review-service
          predicates:
            - Path=/api/v1/reviews/**

        # 6. Realtime Chat & Notification Service (HTTP & WebSocket)
        - id: chat-notification-service-route
          uri: lb://chat-notification-service
          predicates:
            - Path=/api/v1/chat/**, /ws/**
