server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:grabfood_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Cấu hình Cổng thanh toán SePay (Tự động hóa VietQR Napas 247)
sepay:
  bank-name: ${SEPAY_BANK_NAME:MBBank}
  bank-bin: ${SEPAY_BANK_BIN:970422}
  account-no: ${SEPAY_ACCOUNT_NO:0987654321}
  account-name: ${SEPAY_ACCOUNT_NAME:FOOD THUNDER DELI}
  api-key: ${SEPAY_API_KEY:sepay_api_token_here}
  webhook-token: ${SEPAY_WEBHOOK_TOKEN:sepay_webhook_token_here}
  order-prefix: ${SEPAY_ORDER_PREFIX:FOODDELI}
  template: ${SEPAY_TEMPLATE:compact2}
  qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
