version: '3.8'

services:
  # 1. Netflix Eureka Service Registry
  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: ft-discovery-service
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - foodthunder-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Centralized Configuration Server
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: ft-config-server
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    networks:
      - foodthunder-network

  # 3. API Gateway with Dynamic Load Balancing
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ft-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    networks:
      - foodthunder-network

networks:
  foodthunder-network:
    name: foodthunder-microservices-net
    driver: bridge
