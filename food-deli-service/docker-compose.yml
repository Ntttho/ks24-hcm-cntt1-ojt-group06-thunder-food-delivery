services:
  # 0. MySQL Database (Toi uu Performance Schema & Buffer Pool)
  mysql:
    image: mysql:8.0
    container_name: ft-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-grabfood_db}"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=16M
      --max-connections=100
    mem_limit: 384m
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/seed_all.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 0.1 Redis In-Memory Cart & Cache Storage
  redis:
    image: redis:7.2-alpine
    container_name: ft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 96m
    volumes:
      - redis_data:/data
    networks:
      - foodthunder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1. Netflix Eureka Service Registry
  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: ft-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=discovery-service
      - JAVA_TOOL_OPTIONS=-Xms96m -Xmx160m -XX:+UseSerialGC
    mem_limit: 220m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 2. Centralized Configuration Server
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: ft-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - JAVA_TOOL_OPTIONS=-Xms96m -Xmx160m -XX:+UseSerialGC
    mem_limit: 220m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 3. API Gateway with Dynamic Load Balancing
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ft-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx192m -XX:+UseSerialGC
    mem_limit: 260m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 4. Auth & User Microservice
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ft-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
    mem_limit: 340m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 5. Restaurant & Catalog Microservice
  restaurant-service:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    container_name: ft-restaurant-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC
    mem_limit: 340m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 6. Order Fulfillment & State Machine Microservice
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ft-order-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx280m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
    mem_limit: 380m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  # 6.1 Delivery & Shipper Hub Microservice (Port 8084)
  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    container_name: ft-delivery-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx220m -XX:+UseSerialGC
    mem_limit: 300m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 7. Payment Microservice (VNPay Sandbox & COD - Port 8085)
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ft-payment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx220m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
    mem_limit: 300m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 8. Review & Rating Microservice (Port 8086)
  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: ft-review-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx220m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+UseSerialGC
    mem_limit: 300m
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  # 9. Frontend React/Vite Web Client (Port 3000)
  web-client:
    build:
      context: ../food-deli-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: ft-web-client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    mem_limit: 64m
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - foodthunder-network

  # 9. Realtime Chat & Notification WebSocket Hub Microservice (Port 8087)
  chat-notification-service:
    build:
      context: .
      dockerfile: chat-notification-service/Dockerfile
    container_name: ft-chat-notification-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mysql_data:
    name: ft_mysql_data
    driver: local
  redis_data:
    name: ft_redis_data
    driver: local

networks:
  foodthunder-network:
    name: foodthunder-microservices-net
    driver: bridge
