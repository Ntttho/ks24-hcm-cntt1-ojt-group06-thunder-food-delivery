services:
  # 0. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ft-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-grabfood_db}"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/seed_all.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 0.1 Redis In-Memory Cart & Cache Storage
  redis:
    image: redis:7.2-alpine
    container_name: ft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - foodthunder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 1. Netflix Eureka Service Registry
  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: ft-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      - EUREKA_INSTANCE_HOSTNAME=discovery-service
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 2. Centralized Configuration Server
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: ft-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 3. API Gateway with Dynamic Load Balancing
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ft-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 4. Auth & User Microservice
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: ft-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 5. Restaurant & Catalog Microservice
  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: ft-restaurant-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 6. Order Fulfillment & State Machine Microservice
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: ft-order-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_HOST=discovery-service
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 7. Payment Microservice (VNPay Sandbox & COD - Port 8085)
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: ft-payment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=grabfood_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    networks:
      - foodthunder-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mysql_data:
    name: ft_mysql_data
    driver: local
  redis_data:
    name: ft_redis_data
    driver: local

networks:
  foodthunder-network:
    name: foodthunder-microservices-net
    driver: bridge
