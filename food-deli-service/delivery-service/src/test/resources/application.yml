server:
  port: 8084

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:h2:mem:grabfood_delivery_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

eureka:
  client:
    enabled: false

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000

